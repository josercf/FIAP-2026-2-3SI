# Configuração do serviço de Pedidos da LogiTech.
# Nenhum endereço fica cravado no código: tudo vem de variável de ambiente, com
# um padrão de desenvolvimento local. É isso que permite o mesmo binário rodar
# solto na sua máquina hoje e dentro do Docker Compose na Aula 07 (ADR-006).

spring.application.name=logitech-pedidos
server.port=${LOGITECH_PEDIDOS_PORT:8080}

spring.datasource.url=${LOGITECH_DB_URL:jdbc:postgresql://localhost:5432/logitech}
spring.datasource.username=${LOGITECH_DB_USER:logitech}
spring.datasource.password=${LOGITECH_DB_PASSWORD:logitech}

# Um schema por Bounded Context: o serviço de Pedidos só enxerga o schema pedidos.
spring.jpa.properties.hibernate.default_schema=pedidos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Endereço do serviço de Faturamento (C#, porta 5080).
logitech.faturamento.url=${LOGITECH_FATURAMENTO_URL:http://localhost:5080}
logitech.faturamento.timeout-ms=${LOGITECH_FATURAMENTO_TIMEOUT_MS:3000}
