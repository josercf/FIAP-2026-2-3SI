# Configuração da suíte de testes do laboratório da Aula 10.
#
# `pythonpath` aponta para a raiz do serviço de frete, para que os testes
# importem `app.cotador` sem instalar pacote nenhum e sem gambiarra de
# `sys.path` no topo de cada arquivo.
[pytest]
testpaths = servicos/frete/tests
pythonpath = servicos/frete
addopts = -q --strict-markers
