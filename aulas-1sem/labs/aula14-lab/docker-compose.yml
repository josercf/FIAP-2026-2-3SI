name: arenalog

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arenalog
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arenalog"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  elenco:
    build: ./elenco
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://elenco:elenco@postgres:5432/arenalog
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 8s

  motor-ranking:
    build: ./motor-ranking
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  partidas:
    build: ./partidas
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://partidas:partidas@postgres:5432/arenalog
      ELENCO_URL: http://elenco:8081
      MOTOR_URL: http://motor-ranking:8000
    depends_on:
      postgres:
        condition: service_healthy
      elenco:
        condition: service_healthy
      motor-ranking:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  placar:
    build: ./placar
    ports:
      - "8082:8082"
    environment:
      PARTIDAS_URL: http://partidas:8080
    depends_on:
      partidas:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 8s
