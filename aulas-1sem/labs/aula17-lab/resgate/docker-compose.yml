# =============================================================================
# RESGATE: a plataforma LogiTech inteira, com as seis falhas já corrigidas.
# =============================================================================
#
#     cp resgate/docker-compose.yml docker-compose.yml
#
# Rede de segurança, não atalho. Se você copiar isto sem ter diagnosticado as
# falhas, a Frente 1 fica verde e a banca continua sendo uma incógnita: o que a
# banca pergunta é "por que o serviço X ficou unhealthy", e essa resposta não
# está aqui, está no caminho até aqui.
#
# O que muda em relação ao arquivo com as falhas, uma por uma:
#
#   FALHA-1  healthcheck de `frete` e de `notificacoes` usava `localhost`.
#            Dentro do Alpine o `localhost` resolve primeiro para ::1 (IPv6). O
#            uvicorn do `frete` escuta só em 0.0.0.0, e o healthcheck falhava
#            com "Connection refused" com o serviço no ar. No `notificacoes` a
#            mesma linha passava, porque o servidor do Node escuta em `::`.
#            Medido em 31/07/2026. Trocado por 127.0.0.1 nos dois.
#
#   FALHA-2  LOGITECH_OIDC_ISSUER apontava para http://keycloak:8090, o
#            endereço da rede interna. O `iss` que o Keycloak grava no token é
#            o endereço pelo qual o NAVEGADOR chegou, http://localhost:8090.
#            O issuer é o do navegador; o JWKS é buscado pela rede interna.
#
#   FALHA-3  `keycloak` publicava 8080 no host, a porta do `pedidos`. A ADR-009
#            fixa 8090 justamente por isso. Corrigido para 8090:8090.
#
#   FALHA-4  `rag` dependia do `postgres` pela forma curta de `depends_on`, que
#            espera o container existir, não o banco aceitar conexão. Trocado
#            pela forma longa com condition: service_healthy.
#
#   FALHA-5  `mcp-logitech` não tinha `stdin_open: true`. O transporte do MCP é
#            stdio: sem entrada padrão aberta o processo recebe EOF e sai, e o
#            container entra em laço de reinício.
#
#   FALHA-6  LOGITECH_AUTH_ATIVA não estava declarada, e o padrão dela é false
#            (ADR-009). A plataforma subia inteira e sem autenticação nenhuma.
# =============================================================================

name: logitech

# Bloco reutilizável de healthcheck, com âncora YAML, herdado da Aula 07.
x-saude: &saude
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

# Os quatro valores de identidade que quase todo backend precisa. Repetir isto
# doze vezes é como o erro de issuer nasce: um serviço fica para trás numa
# correção e passa a recusar o token que os outros aceitam.
x-identidade: &identidade
  LOGITECH_AUTH_ATIVA: "true"
  LOGITECH_OIDC_ISSUER: http://localhost:8090/realms/logitech
  LOGITECH_OIDC_JWKS_URL: http://keycloak:8090/realms/logitech/protocol/openid-connect/certs
  LOGITECH_CORS_ORIGINS: http://localhost:5173,http://localhost:4200

services:

  # =====================================================================
  # Infraestrutura: banco e identidade
  # =====================================================================

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: logitech
      POSTGRES_USER: logitech
      POSTGRES_PASSWORD: ${LOGITECH_DB_PASSWORD:?defina LOGITECH_DB_PASSWORD no .env (copie de .env.exemplo)}
    volumes:
      - logitech-postgres:/var/lib/postgresql/data
      - ./banco:/docker-entrypoint-initdb.d:ro
    # Repare que o banco NÃO publica porta nenhuma no host, como na Aula 07:
    # ele só é alcançável de dentro da rede da plataforma. Além de ser a
    # postura certa, evita a colisão com qualquer PostgreSQL que já esteja
    # ocupando a 5432 na máquina, que é o defeito mais comum de quem tem
    # outro projeto de pé. Para abrir o `psql`:
    #     docker compose exec postgres psql -U logitech -d logitech
    networks:
      - logitech-net
    mem_limit: 384m
    healthcheck:
      <<: *saude
      test: ["CMD-SHELL", "pg_isready -U logitech -d logitech"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8090"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LOGITECH_KEYCLOAK_ADMIN_SENHA:-admin}
      # O endereço pelo qual o navegador alcança o Keycloak. É ELE que acaba
      # dentro do `iss` de todo token emitido, e é por isso que os serviços
      # esperam `localhost:8090` no issuer mesmo estando na rede interna.
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      # 8090, e não 8080: a 8080 é do `pedidos` desde a ADR-006.
      - "8090:8090"
    networks:
      - logitech-net
    mem_limit: 768m
    healthcheck:
      <<: *saude
      # A imagem do Keycloak 26 não traz `wget` nem `curl`: ela é UBI micro. O
      # que ela traz é `bash`, e o /dev/tcp do bash abre socket. Este é o
      # exemplo de que healthcheck não é um comando fixo, é uma pergunta que
      # cada imagem responde com o que tem dentro.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      start_period: 60s

  # =====================================================================
  # Telemetria: os dois serviços mais antigos da plataforma
  # =====================================================================

  coletor:
    build: ./servicos/coletor
    environment:
      LOGITECH_DADOS: /dados/telemetria.jsonl
    volumes:
      - logitech-telemetria:/dados
    ports:
      - "8081:8081/udp"
      - "8082:8082"
    networks:
      - logitech-net
    mem_limit: 96m
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]

  painel:
    build: ./servicos/painel
    environment:
      LOGITECH_TELEMETRIA_URL: http://coletor:8082/telemetria
      LOGITECH_CORS_ORIGINS: http://localhost:5173,http://localhost:4200
    ports:
      - "3000:3000"
    networks:
      - logitech-net
    mem_limit: 128m
    depends_on:
      coletor:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]

  # =====================================================================
  # Negócio: os quatro serviços das Aulas 05 e 06
  # =====================================================================

  pedidos:
    build: ./servicos/pedidos
    environment:
      <<: *identidade
      LOGITECH_DB_URL: jdbc:postgresql://postgres:5432/logitech
      LOGITECH_DB_USER: logitech
      LOGITECH_DB_PASSWORD: ${LOGITECH_DB_PASSWORD}
      LOGITECH_FRETE_URL: http://frete:8000
      LOGITECH_FATURAMENTO_URL: http://faturamento:5080
      LOGITECH_NOTIFICACOES_URL: http://notificacoes:3001
    ports:
      - "8080:8080"
    networks:
      - logitech-net
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]

  faturamento:
    build: ./servicos/faturamento
    environment:
      <<: *identidade
      LOGITECH_DB_URL: Host=postgres;Port=5432;Database=logitech;Username=logitech;Password=${LOGITECH_DB_PASSWORD}
      LOGITECH_FATURAMENTO_ATRASO_MS: "800"
    ports:
      - "5080:5080"
    networks:
      - logitech-net
    mem_limit: 256m
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5080/health"]

  frete:
    build: ./servicos/frete
    environment:
      <<: *identidade
    ports:
      - "8000:8000"
    networks:
      - logitech-net
    mem_limit: 192m
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *saude
      # 127.0.0.1, e não localhost. FALHA-1 estava aqui.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]

  notificacoes:
    build: ./servicos/notificacoes
    environment:
      <<: *identidade
    ports:
      - "3001:3001"
    networks:
      - logitech-net
    mem_limit: 160m
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *saude
      # 127.0.0.1, e não localhost. FALHA-1 também estava aqui, e aqui ela
      # PASSAVA: o servidor HTTP do Node escuta em `::` e aceita IPv4 mapeado,
      # enquanto o uvicorn do `frete` escuta só em `0.0.0.0`. Corrigir os dois
      # é a decisão certa mesmo assim: defeito que só não aparece porque a
      # stack é tolerante volta na próxima imagem base.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]

  # =====================================================================
  # Inteligência: gateway, RAG e o servidor MCP
  # =====================================================================

  ai-gateway:
    build: ./servicos/ai-gateway
    environment:
      <<: *identidade
      LOGITECH_GUARDRAILS_ATIVOS: "true"
      LOGITECH_IA_ESTRATEGIA: preferir-remoto
      LOGITECH_IA_REMOTA_URL: https://api.openai.com/v1/chat/completions
      LOGITECH_IA_REMOTA_CHAVE: ${LOGITECH_IA_REMOTA_CHAVE:-}
      LOGITECH_IA_OLLAMA_URL: http://host.docker.internal:11434
      LOGITECH_IA_MODELO_LOCAL: ${LOGITECH_IA_MODELO_LOCAL:-qwen2.5:1.5b}
      LOGITECH_IA_LIMITE_POR_MINUTO: "60"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    networks:
      - logitech-net
    mem_limit: 256m
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]

  rag:
    build:
      # A raiz, e não ./servicos/rag: o Dockerfile precisa de `contratos/`.
      context: .
      dockerfile: servicos/rag/Dockerfile
    environment:
      <<: *identidade
      LOGITECH_DB_URL: postgresql://logitech:${LOGITECH_DB_PASSWORD}@postgres:5432/logitech
      LOGITECH_OLLAMA_URL: http://host.docker.internal:11434
      LOGITECH_EMBEDDING_MODELO: ${LOGITECH_EMBEDDING_MODELO:-paraphrase-multilingual}
      LOGITECH_MODELO: ${LOGITECH_MODELO:-qwen2.5:1.5b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8010"
    networks:
      - logitech-net
    mem_limit: 320m
    depends_on:
      # Forma longa, com condição. A curta espera o container existir, não o
      # banco aceitar conexão, e o `rag` morre na primeira consulta. FALHA-4.
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *saude
      # A imagem é `slim` por causa do psycopg, e slim não traz o wget do
      # BusyBox. O Python que já está dentro resolve.
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/health',timeout=3)"

  mcp-logitech:
    build:
      context: .
      dockerfile: servicos/mcp-logitech/Dockerfile
    environment:
      LOGITECH_RAG_URL: http://rag:8010
      LOGITECH_PEDIDOS_URL: http://pedidos:8080
      LOGITECH_OIDC_TOKEN_URL: http://keycloak:8090/realms/logitech/protocol/openid-connect/token
      LOGITECH_OIDC_CLIENT_ID: logitech-portal
      LOGITECH_MCP_USUARIO: ${LOGITECH_MCP_USUARIO:-carla.admin}
      LOGITECH_MCP_SENHA: ${LOGITECH_MCP_SENHA:-logitech}
    # O décimo terceiro serviço, e o único SEM porta: o transporte do MCP é
    # stdio. `stdin_open` mantém a entrada padrão aberta; sem ele o processo
    # recebe EOF e sai na hora. FALHA-5.
    stdin_open: true
    networks:
      - logitech-net
    mem_limit: 160m
    depends_on:
      rag:
        condition: service_healthy
    healthcheck:
      <<: *saude
      # Não há /health para chamar: este serviço não fala HTTP. O que prova que
      # ele está de pé é o próprio aperto de mão do MCP, e é isso que o cliente
      # de teste faz, subindo um segundo servidor como processo filho.
      test: ["CMD", "node", "--experimental-strip-types", "src/cliente-teste.ts", "--json", "--sem-busca"]
      start_period: 20s

  # =====================================================================
  # Frontends: as duas telas
  # =====================================================================

  portal:
    build:
      context: ./servicos/portal
      args:
        VITE_PEDIDOS_URL: http://localhost:8080
        VITE_FRETE_URL: http://localhost:8000
        VITE_OIDC_AUTORIDADE: http://localhost:8090/realms/logitech
        VITE_OIDC_CLIENT_ID: logitech-portal
    ports:
      - "5173:5173"
    networks:
      - logitech-net
    mem_limit: 128m
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/health"]

  painel-admin:
    build: ./servicos/painel-admin
    ports:
      - "4200:4200"
    networks:
      - logitech-net
    mem_limit: 128m
    healthcheck:
      <<: *saude
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/health"]

# -------------------------------------------------------------------------
# Rede e volumes
# -------------------------------------------------------------------------

networks:
  logitech-net:
    # Herdada da Aula 03, criada à mão. `external: true` diz ao Compose para
    # usar a que já existe em vez de criar outra. Se ela não existir, o erro
    # que o Compose devolve não diz "crie a rede": ele diz que a rede
    # declarada como externa não foi encontrada, e é o `post-create.sh` que a
    # cria no devcontainer.
    external: true

volumes:
  logitech-telemetria:
    external: true
  logitech-postgres:
    name: logitech-postgres
